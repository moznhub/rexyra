name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Build, lint and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p rexyra-server

  clients-dotnet:
    name: Client tests (StackExchange.Redis ${{ matrix.version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["2.12.14", "3.4.35"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the server
        run: cargo build --release -p rexyra-server
      - name: Test
        run: dotnet test clients/dotnet/StackExchangeRedis -p:StackExchangeRedisVersion=${{ matrix.version }} --logger "console;verbosity=normal"

  clients-python:
    name: Client tests (redis-py ${{ matrix.version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["8.1.0", "5.3.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: clients/python/redis-py/requirements.txt
      - name: Build the server
        run: cargo build --release -p rexyra-server
      - name: Install
        working-directory: clients/python/redis-py
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "redis==${{ matrix.version }}"
      - name: Test
        working-directory: clients/python/redis-py
        run: python -m pytest -ra

  clients-java:
    name: Client tests (${{ matrix.library }} ${{ matrix.version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { library: Jedis, property: jedis.version, version: "8.0.2" }
          - { library: Jedis, property: jedis.version, version: "7.5.3" }
          - { library: Lettuce, property: lettuce.version, version: "7.9.0.RELEASE" }
          - { library: Lettuce, property: lettuce.version, version: "6.9.0.RELEASE" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: clients/java/pom.xml
      - name: Build the server
        run: cargo build --release -p rexyra-server
      - name: Test
        working-directory: clients/java
        run: mvn -B clean test "-Dtest=${{ matrix.library }}*" "-D${{ matrix.property }}=${{ matrix.version }}"

  clients-go:
    name: Client tests (go-redis ${{ matrix.version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["v9.23.0", "v9.7.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: clients/go/go-redis/go.mod
          cache-dependency-path: clients/go/go-redis/go.sum
      - name: Build the server
        run: cargo build --release -p rexyra-server
      - name: Test
        shell: pwsh
        working-directory: clients/go/go-redis
        run: ./test-version.ps1 ${{ matrix.version }} -v

  fuzz:
    # The protocol crate has no platform-specific code, and libFuzzer is best
    # supported on Linux, so the fuzz smoke test runs there.
    name: Fuzz smoke test (protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz request parser
        run: cargo fuzz run request -- -max_total_time=60
      - name: Fuzz frame decoder
        run: cargo fuzz run frame -- -max_total_time=60
