name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Build, lint and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p rexyra-server

  clients-dotnet:
    name: Client tests (StackExchange.Redis ${{ matrix.version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["2.12.14", "3.4.35"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the server
        run: cargo build --release -p rexyra-server
      - name: Test
        run: dotnet test clients/dotnet/StackExchangeRedis -p:StackExchangeRedisVersion=${{ matrix.version }} --logger "console;verbosity=normal"

  fuzz:
    # The protocol crate has no platform-specific code, and libFuzzer is best
    # supported on Linux, so the fuzz smoke test runs there.
    name: Fuzz smoke test (protocol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz request parser
        run: cargo fuzz run request -- -max_total_time=60
      - name: Fuzz frame decoder
        run: cargo fuzz run frame -- -max_total_time=60
